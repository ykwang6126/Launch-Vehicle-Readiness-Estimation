[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lvreadiness"
version = "0.1.0"
description = "Bayesian launch vehicle readiness assessment, ported from MATLAB v13"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "openpyxl>=3.1", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lvreadiness = "lvreadiness.cli:main"

# Source files live directly in src; installation exposes them as lvreadiness.
[tool.setuptools]
packages = ["lvreadiness"]
package-dir = {lvreadiness = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
